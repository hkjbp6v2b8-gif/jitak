<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق جِيتك - Jitak</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 850px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
        }
        .header {
            background-color: #1e293b;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .content {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .btn {
            width: 100%;
            padding: 12px;
            margin: 6px 0;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn:active { background-color: #1d4ed8; }
        .btn-success { background-color: #16a34a; }
        .btn-success:active { background-color: #15803d; }
        .btn-danger { background-color: #dc2626; }
        .input-field {
            width: 100%;
            padding: 11px;
            margin: 6px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: right;
        }
        .nav-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }
        .footer {
            padding: 10px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <span>جِيتك | Jitak</span>
            <span style="font-size: 14px; cursor: pointer;" onclick="location.reload()">🏠</span>
        </div>
        
        <div class="content" id="app-view">
            <!-- الشاشة الرئيسية -->
            <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center;">
                <h2>مرحباً بك في تطبيق جِيتك</h2>
                <p style="color: #64748b; margin-bottom: 25px;">منصة النقل والخدمات الذكية المتكاملة.</p>
                <button class="btn" onclick="showLogin('driver')">🚗 تسجيل دخول كـ سائق</button>
                <button class="btn btn-success" onclick="showLogin('customer')">👤 تسجيل دخول كـ عميل</button>
            </div>
        </div>

        <div class="footer">جميع الحقوق محفوظة © 2026 Jitak</div>
    </div>

    <script>
        function showLogin(type) {
            const title = type === 'driver' ? 'تسجيل دخول السائق' : 'تسجيل دخول العميل';
            document.getElementById('app-view').innerHTML = `
                <h2>${title}</h2>
                <p style="color: #64748b;">أدخل بيانات حسابك للمتابعة.</p>
                <input type="text" class="input-field" placeholder="📱 رقم الهاتف">
                <input type="password" class="input-field" placeholder="🔒 كلمة المرور">
                <button class="btn" onclick="showDashboard('${type}')">تسجيل الدخول</button>
                <button class="btn" style="background-color: #64748b;" onclick="location.reload()">العودة للرئيسية</button>
            `;
        }

        function showDashboard(type) {
            if (type === 'driver') {
                document.getElementById('app-view').innerHTML = `
                    <h2>لوحة تحكم السائق</h2>
                    <div class="card">
                        <strong>🟢 حالة الاتصال:</strong> متصل وجاهز للطلبات
                    </div>
                    <div class="nav-grid">
                        <button class="btn btn-success" onclick="showScreen('driver_orders')">📦 الطلبات</button>
                        <button class="btn" onclick="showScreen('driver_wallet')">💰 المحفظة</button>
                        <button class="btn" onclick="showScreen('driver_profile')">👤 الملف الشخصي</button>
                        <button class="btn" style="background-color: #475569;" onclick="showScreen('settings')">⚙️ الإعدادات</button>
                    </div>
                    <button class="btn btn-danger" style="margin-top: 20px;" onclick="location.reload()">تسجيل الخروج</button>
                `;
            } else {
                document.getElementById('app-view').innerHTML = `
                    <h2>شاشة العميل الرئيسية</h2>
                    <div class="card">
                        <strong>📍 حدد وجهتك:</strong>
                        <input type="text" class="input-field" placeholder="أدخل موقع التوصيل أو الوجهة">
                    </div>
                    <div class="nav-grid">
                        <button class="btn btn-success" onclick="alert('جاري البحث عن أقرب كابتن...')">🚖 اطلب رحلة الآن</button>
                        <button class="btn" onclick="showScreen('ride_history')">📜 رحلاتي السابقة</button>
                        <button class="btn" onclick="showScreen('tracking')">🗺️ تتبع الرحلة</button>
                        <button class="btn" style="background-color: #475569;" onclick="showScreen('settings')">⚙️ الإعدادات</button>
                    </div>
                    <button class="btn btn-danger" style="margin-top: 20px;" onclick="location.reload()">تسجيل الخروج</button>
                `;
            }
        }

        function showScreen(screen) {
            let content = '';
            if (screen === 'driver_orders') {
                content = `
                    <h2>📦 طلبات التوصيل المتاحة</h2>
                    <div class="card"><strong>الطلب #102:</strong> طريق الشط - توصيل طرد (15 د.ل)<br><button class="btn btn-success" style="margin-top:8px;" onclick="alert('تم قبول الطلب بنجاح!')">قبول الطلب</button></div>
                `;
            } else if (screen === 'driver_wallet') {
                content = `
                    <h2>💰 محفظة السائق</h2>
                    <div class="card" style="text-align:center;">إجمالي الأرباح: <strong style="color:#16a34a; font-size:18px;">240.00 د.ل</strong></div>
                `;
            } else if (screen === 'driver_profile') {
                content = `
                    <h2>👤 ملف السائق</h2>
                    <div class="card">الاسم: سائق جِيتك<br>التقييم: ⭐ 4.9<br>المركبة: سيارة خاصة</div>
                `;
            } else if (screen === 'ride_history') {
                content = `
                    <h2>📜 الرحلات السابقة</h2>
                    <div class="card">رحلة إلى وسط البلاد - مكتملة</div>
                `;
            } else if (screen === 'tracking') {
                content = `
                    <h2>🗺️ تتبع الرحلة الحية</h2>
                    <div class="card" style="text-align:center; padding: 30px;">[ خريطة التتبع المباشر مفعلة ]</div>
                `;
            } else if (screen === 'settings') {
                content = `
                    <h2>⚙️ الإعدادات العامة</h2>
                    <div class="card">اللغة: العربية (AR)<br>الإشعارات: مفعلة</div>
                `;
            }

            document.getElementById('app-view').innerHTML = `
                ${content}
                <button class="btn" style="background-color: #64748b; margin-top: 15px;" onclick="location.reload()">العودة للوحة التحكم</button>
            `;
        }
    </script>
</body>
</html>
