<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق جِيتك - Jitak</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            height: 100%;
            max-height: 850px;
            background: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
        }
        .header {
            background-color: #1e293b;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
        }
        .content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .btn {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn:active {
            background-color: #1d4ed8;
        }
        .btn-success {
            background-color: #16a34a;
        }
        .btn-success:active {
            background-color: #15803d;
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            text-align: right;
        }
        .footer {
            padding: 12px;
            text-align: center;
            color: #64748b;
            font-size: 13px;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">جِيتك | Jitak</div>
        <div class="content" id="app-view">
            <!-- الشاشة الرئيسية -->
            <div style="display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; text-align: center;">
                <h2>مرحباً بك في تطبيق جِيتك</h2>
                <p style="color: #64748b; margin-bottom: 30px;">منصة النقل والخدمات الذكية الخاصة بك.</p>
                <button class="btn" onclick="showLogin('driver')">تسجيل دخول كـ سائق</button>
                <button class="btn btn-success" onclick="showLogin('customer')">تسجيل دخول كـ عميل</button>
            </div>
        </div>
        <div class="footer">جميع الحقوق محفوظة © 2026 Jitak</div>
    </div>

    <script>
        function showLogin(type) {
            const title = type === 'driver' ? 'تسجيل دخول السائق' : 'تسجيل دخول العميل';
            document.getElementById('app-view').innerHTML = `
                <h2>${title}</h2>
                <p style="color: #64748b;">الرجاء إدخال بيانات حسابك للمتابعة.</p>
                <input type="text" class="input-field" placeholder="رقم الهاتف أو البريد الإلكتروني">
                <input type="password" class="input-field" placeholder="كلمة المرور">
                <button class="btn" onclick="showDashboard('${type}')">دخول</button>
                <button class="btn" style="background-color: #64748b;" onclick="location.reload()">العودة للرئيسية</button>
            `;
        }

        function showDashboard(type) {
            if (type === 'driver') {
                document.getElementById('app-view').innerHTML = `
                    <h2>شاشة السائق الرئيسية</h2>
                    <div class="card">
                        <strong>حالة الطوارئ / الخدمة:</strong>
                        <p style="margin: 5px 0 0; color: #16a34a;">متصل وجاهز لاستقبال الطلبات</p>
                    </div>
                    <div class="card">
                        <strong>الطلبات القريبة:</strong>
                        <p style="margin: 5px 0 0; color: #64748b;">لا توجد رحلات جديدة حالياً</p>
                    </div>
                    <button class="btn btn-success" onclick="alert('تم تحديث الحالة بنجاح!')">تحديث الحالة</button>
                    <button class="btn" style="background-color: #dc2626;" onclick="location.reload()">تسجيل الخروج</button>
                `;
            } else {
                document.getElementById('app-view').innerHTML = `
                    <h2>شاشة العميل</h2>
                    <div class="card">
                        <strong>إلى أين تريد الذهاب اليوم؟</strong>
                        <input type="text" class="input-field" placeholder="أدخل الوجهة أو الموقع الحالي">
                    </div>
                    <button class="btn btn-success" onclick="alert('جاري البحث عن أقرب سائق متاح...')">اطلب رحلتك الآن</button>
                    <button class="btn" style="background-color: #dc2626;" onclick="location.reload()">تسجيل الخروج</button>
                `;
            }
        }
    </script>
</body>
</html>
